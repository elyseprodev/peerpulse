<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071521" />
    <title>PeerPulse — Trade Time. Share Skills. Grow Together.</title>
    <meta
      name="description"
      content="PeerPulse is a community-driven skill exchange. Teach what you know, learn what you want, and settle every session in Time Tokens — no money involved."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      try {
        const stored = localStorage.getItem('peerpulse.theme')
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        const theme = stored ?? (prefersLight ? 'light' : 'dark')
        document.documentElement.classList.toggle('light', theme === 'light')
        document.documentElement.dataset.theme = theme
      } catch (e) {
        /* no-op */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>PeerPulse requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
